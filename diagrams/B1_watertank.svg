<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 580" width="1140" height="580" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2F4257"/>
    </marker>
    <style>
      .box { fill:#FBFCFE; stroke:#2F4257; stroke-width:1.6; }
      .name { font-size:17px; font-weight:700; fill:#16222E; }
      .act { font-size:12px; fill:#4A5C70; }
      .flow { stroke:#2F4257; stroke-width:1.6; fill:none; }
      .lbl { font-size:12.5px; fill:#33475B; }
      .sep { stroke:#C3D0E0; stroke-width:1; }
      .comp { fill:#F5F8FC; stroke:#3D5673; stroke-width:1.8; }
      .compname { font-size:15px; font-weight:700; fill:#2C4A6E; }
    </style>
  </defs>

  <rect x="0" y="0" width="1140" height="580" fill="#FFFFFF"/>

  <!-- 复合状态：运行中 -->
  <rect class="comp" x="330" y="60" width="770" height="470" rx="14"/>
  <text class="compname" x="350" y="90">运行中 Running</text>

  <!-- 初始伪状态 -->
  <circle cx="495" cy="26" r="8" fill="#2F4257"/>
  <path class="flow" d="M495,34 L495,138" marker-end="url(#arrow)"/>
  <text class="lbl" x="507" y="54">系统上电</text>

  <!-- 休眠 -->
  <rect class="box" x="30" y="60" width="180" height="90" rx="9"/>
  <text class="name" x="120" y="88" text-anchor="middle">休眠</text>
  <line class="sep" x1="50" y1="100" x2="190" y2="100"/>
  <text class="act" x="120" y="122" text-anchor="middle">entry / 断开电源</text>

  <!-- 监测 -->
  <rect class="box" x="430" y="140" width="190" height="80" rx="9"/>
  <text class="name" x="525" y="168" text-anchor="middle">监测</text>
  <line class="sep" x1="450" y1="180" x2="600" y2="180"/>
  <text class="act" x="525" y="202" text-anchor="middle">do / 采样温度与水量</text>

  <!-- 缺水告警 -->
  <rect class="box" x="820" y="140" width="190" height="80" rx="9"/>
  <text class="name" x="915" y="168" text-anchor="middle">缺水告警</text>
  <line class="sep" x1="840" y1="180" x2="990" y2="180"/>
  <text class="act" x="915" y="202" text-anchor="middle">entry / 保持继电器断开</text>

  <!-- 加热 -->
  <rect class="box" x="430" y="390" width="190" height="80" rx="9"/>
  <text class="name" x="525" y="418" text-anchor="middle">加热</text>
  <line class="sep" x1="450" y1="430" x2="600" y2="430"/>
  <text class="act" x="525" y="452" text-anchor="middle">do / 闭合继电器烧水</text>

  <!-- 维修 -->
  <rect class="box" x="820" y="390" width="190" height="80" rx="9"/>
  <text class="name" x="915" y="418" text-anchor="middle">维修</text>
  <line class="sep" x1="840" y1="430" x2="990" y2="430"/>
  <text class="act" x="915" y="452" text-anchor="middle">entry / 断电待修</text>

  <!-- 运行中 -> 休眠 -->
  <path class="flow" d="M330,110 L212,110" marker-end="url(#arrow)"/>
  <text class="lbl" x="270" y="82" text-anchor="middle">时间 = 23:00</text>
  <text class="lbl" x="270" y="98" text-anchor="middle">断电进入休眠</text>

  <!-- 休眠 -> 运行中 -->
  <path class="flow" d="M210,140 L328,140" marker-end="url(#arrow)"/>
  <text class="lbl" x="270" y="164" text-anchor="middle">时间 = 07:00</text>
  <text class="lbl" x="270" y="180" text-anchor="middle">自动恢复运行</text>

  <!-- 监测 -> 加热 -->
  <path class="flow" d="M480,220 L480,388" marker-end="url(#arrow)"/>
  <text class="lbl" x="468" y="290" text-anchor="end">温度 &lt; 20℃ 且 有水</text>
  <text class="lbl" x="468" y="306" text-anchor="end">闭合继电器</text>

  <!-- 加热 -> 监测 -->
  <path class="flow" d="M520,390 L520,222" marker-end="url(#arrow)"/>
  <text class="lbl" x="532" y="290">温度 ≥ 100℃</text>
  <text class="lbl" x="532" y="306">断开继电器</text>

  <!-- 监测 -> 缺水告警 -->
  <path class="flow" d="M620,200 L818,200" marker-end="url(#arrow)"/>
  <text class="lbl" x="719" y="168" text-anchor="middle">温度 &lt; 20℃ 且 无水</text>
  <text class="lbl" x="719" y="184" text-anchor="middle">不闭合继电器</text>

  <!-- 缺水告警 -> 加热 -->
  <path class="flow" d="M910,220 L910,340 L660,340 L660,415 L622,415" marker-end="url(#arrow)"/>
  <text class="lbl" x="785" y="300" text-anchor="middle">补水完成 且 温度 &lt; 20℃</text>
  <text class="lbl" x="785" y="316" text-anchor="middle">闭合继电器</text>

  <!-- 加热 -> 维修 -->
  <path class="flow" d="M620,445 L818,445" marker-end="url(#arrow)"/>
  <text class="lbl" x="719" y="470" text-anchor="middle">水箱烧坏</text>
  <text class="lbl" x="719" y="486" text-anchor="middle">断开电源</text>

  <!-- 维修 -> 监测 -->
  <path class="flow" d="M1010,410 L1060,410 L1060,120 L560,120 L560,138" marker-end="url(#arrow)"/>
  <text class="lbl" x="800" y="108" text-anchor="middle">维修完成 / 复位到监测</text>
</svg>
